<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>동화 출결 안내</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Noto Sans KR 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        /* 모바일 세로 스크롤 감추기 옵션 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-indigo-500 selection:text-white pb-10">

    <!-- 최상단 헤더 -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
        <div class="max-w-md mx-auto px-4 pt-3 pb-3 space-y-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-sm shadow-sm">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <h1 class="text-base font-bold text-slate-800 tracking-tight">동화 출결 안내</h1>
                </div>
                <span class="text-xs font-semibold px-2 py-1 bg-indigo-50 text-indigo-600 rounded-full border border-indigo-100">2026학년도</span>
            </div>

            <!-- 시인성을 대폭 강화한 구글 드라이브 양식 다운로드 버튼 -->
            <a href="https://drive.google.com/uc?export=download&id=16mUUcY7G6PHQQPQHZP8KOZZVlvFJ1lwj" 
               target="_blank" 
               rel="noopener noreferrer"
               class="w-full flex items-center justify-between bg-gradient-to-r from-indigo-600 via-indigo-700 to-blue-600 hover:from-indigo-700 hover:to-blue-800 text-white font-extrabold py-4 px-4 sm:px-5 rounded-2xl shadow-xl hover:shadow-indigo-500/30 ring-4 ring-indigo-500/20 active:scale-[0.98] transition-all duration-200 group relative overflow-hidden">
                
                <!-- 배경 은은한 광원 효과 -->
                <div class="absolute -right-4 -bottom-4 w-24 h-24 bg-white/10 rounded-full blur-xl group-hover:scale-150 transition-transform duration-500 pointer-events-none"></div>

                <div class="flex items-center space-x-3 z-10 flex-1 min-w-0 mr-2">
                    <div class="w-10 h-10 rounded-xl bg-white/20 flex-shrink-0 flex items-center justify-center group-hover:scale-110 group-hover:bg-white/30 transition-all shadow-inner">
                        <i class="fa-solid fa-file-arrow-down text-xl text-white"></i>
                    </div>
                    <div class="flex flex-col text-left truncate">
                        <span class="text-sm sm:text-base font-black tracking-tight leading-snug truncate">결석계, 체험학습 양식</span>
                        <span class="text-[11px] sm:text-xs font-medium text-indigo-100/90 truncate">클릭 시 즉시 다운로드 (.hwp)</span>
                    </div>
                </div>

                <!-- 오른쪽 '바로다운받기' 배지 버튼 (크기와 폰트 확대) -->
                <div class="flex-shrink-0 flex items-center space-x-1.5 text-xs sm:text-sm font-black bg-white text-indigo-700 hover:bg-indigo-50 px-3.5 py-2 rounded-xl shadow-md group-hover:shadow-lg group-hover:scale-105 transition-all z-10">
                    <span>바로다운받기</span>
                    <i class="fa-solid fa-download text-xs group-hover:translate-y-0.5 transition-transform"></i>
                </div>
            </a>
        </div>

        <!-- 카테고리 탭 메뉴 (3개) -->
        <div class="max-w-md mx-auto px-4">
            <nav class="flex border-b border-slate-200 space-x-4 justify-between" aria-label="Tabs">
                <button onclick="switchTab('approved')" id="tab-approved" 
                        class="tab-btn w-1/3 py-2.5 text-xs font-bold border-b-2 text-indigo-600 border-indigo-600 transition-colors duration-150 flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-circle-check"></i>
                    <span>인정결석</span>
                </button>
                <button onclick="switchTab('disease')" id="tab-disease" 
                        class="tab-btn w-1/3 py-2.5 text-xs font-bold border-b-2 text-slate-500 border-transparent hover:text-slate-700 transition-colors duration-150 flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-notes-medical"></i>
                    <span>질병결석</span>
                </button>
                <button onclick="switchTab('other')" id="tab-other" 
                        class="tab-btn w-1/3 py-2.5 text-xs font-bold border-b-2 text-slate-500 border-transparent hover:text-slate-700 transition-colors duration-150 flex items-center justify-center space-x-1">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>기타결석</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- 메인 컨텐츠 영역 -->
    <main class="max-w-md mx-auto px-4 pt-4">

        <!-- 탭 설명 안내 바 -->
        <div id="tab-desc" class="mb-3 p-3 bg-indigo-50/70 border border-indigo-100 rounded-xl flex items-start space-x-2.5 text-xs text-indigo-900">
            <i class="fa-solid fa-circle-info text-indigo-500 mt-0.5 text-sm flex-shrink-0"></i>
            <span id="tab-desc-text" class="leading-relaxed">학교장이 정한 사유에 의해 출석으로 인정받는 결석입니다.</span>
        </div>

        <!-- 카드 리스트 영역 -->
        <div id="card-container" class="space-y-3">
            <!-- JS로 항목 카드가 동적으로 생성됩니다 -->
        </div>

    </main>

    <!-- 상세보기 팝업 모달 -->
    <div id="detail-modal" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-200 p-0 sm:p-4">
        <div id="modal-content" class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl shadow-xl max-h-[85vh] flex flex-col transform translate-y-full sm:translate-y-0 transition-transform duration-200">
            
            <!-- 모달 헤더 -->
            <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/80 rounded-t-2xl">
                <div class="flex items-center space-x-2.5">
                    <span id="modal-badge" class="px-2 py-0.5 text-[11px] font-bold rounded-md bg-indigo-100 text-indigo-700">인정결석</span>
                    <h3 id="modal-title" class="text-base font-bold text-slate-800">상세 항목 제목</h3>
                </div>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-200/60 hover:bg-slate-200 flex items-center justify-center text-slate-500 transition-colors">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>

            <!-- 모달 바디 (스크롤 지원) -->
            <div class="p-5 overflow-y-auto space-y-4 text-xs sm:text-sm leading-relaxed no-scrollbar">
                
                <!-- 상세 설명 -->
                <div>
                    <h4 class="font-bold text-slate-700 mb-1 flex items-center">
                        <i class="fa-solid fa-align-left text-indigo-500 mr-1.5"></i>상세 내용
                    </h4>
                    <p id="modal-desc" class="text-slate-600 bg-slate-50 p-3 rounded-xl border border-slate-100 whitespace-pre-line"></p>
                </div>

                <!-- 경조사 세부 일수 표 (경조사 클릭 시에만 노출) -->
                <div id="modal-event-table" class="hidden">
                    <h4 class="font-bold text-slate-700 mb-1.5 flex items-center">
                        <i class="fa-solid fa-table-list text-indigo-500 mr-1.5"></i>경조사 대상별 인정 일수표
                    </h4>
                    <div class="overflow-hidden border border-slate-200 rounded-xl">
                        <table class="w-full text-left text-xs text-slate-600">
                            <thead class="bg-indigo-50/50 text-indigo-900 font-bold border-b border-slate-200">
                                <tr>
                                    <th class="p-2.5">구분</th>
                                    <th class="p-2.5">대상</th>
                                    <th class="p-2.5 text-center">인정 일수</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 bg-white">
                                <tr>
                                    <td class="p-2.5 font-semibold text-slate-700">결혼</td>
                                    <td class="p-2.5">형제·자매</td>
                                    <td class="p-2.5 text-center font-bold text-indigo-600">1일</td>
                                </tr>
                                <tr>
                                    <td class="p-2.5 font-semibold text-slate-700">입양</td>
                                    <td class="p-2.5">본인</td>
                                    <td class="p-2.5 text-center font-bold text-indigo-600">20일</td>
                                </tr>
                                <tr>
                                    <td class="p-2.5 font-semibold text-slate-700" rowspan="3">사망</td>
                                    <td class="p-2.5">부모, 조부모, 외조부모</td>
                                    <td class="p-2.5 text-center font-bold text-slate-700">5일</td>
                                </tr>
                                <tr>
                                    <td class="p-2.5">증조부모, 외증조부모, 형제·자매</td>
                                    <td class="p-2.5 text-center font-bold text-slate-700">3일</td>
                                </tr>
                                <tr>
                                    <td class="p-2.5">부모의 형제·자매 (삼촌, 이모, 고모 등)</td>
                                    <td class="p-2.5 text-center font-bold text-slate-700">1일</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 제출 서류 -->
                <div>
                    <h4 class="font-bold text-slate-700 mb-1 flex items-center">
                        <i class="fa-solid fa-file-circle-check text-emerald-500 mr-1.5"></i>필요 제출 서류
                    </h4>
                    <div id="modal-docs" class="text-slate-700 font-medium bg-emerald-50/60 p-3 rounded-xl border border-emerald-100/80"></div>
                </div>

                <!-- 제출 기한 -->
                <div>
                    <h4 class="font-bold text-slate-700 mb-1 flex items-center">
                        <i class="fa-solid fa-clock text-amber-500 mr-1.5"></i>제출 기한
                    </h4>
                    <p id="modal-period" class="text-slate-600 bg-amber-50/50 p-3 rounded-xl border border-amber-100/80"></p>
                </div>

                <!-- 주의 사항 -->
                <div>
                    <h4 class="font-bold text-slate-700 mb-1 flex items-center">
                        <i class="fa-solid fa-circle-exclamation text-rose-500 mr-1.5"></i>유의사항
                    </h4>
                    <p id="modal-notes" class="text-slate-500 bg-slate-50 p-3 rounded-xl border border-slate-100 text-xs leading-normal"></p>
                </div>

            </div>

            <!-- 모달 하단 닫기 버튼 -->
            <div class="p-4 border-t border-slate-100 bg-slate-50 rounded-b-2xl">
                <button onclick="closeModal()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white font-semibold rounded-xl text-xs transition-colors">
                    확인 및 닫기
                </button>
            </div>

        </div>
    </div>

    <script>
        // 출결 데이터 구조
        const ATTENDANCE_DATA = {
            approved: {
                desc: "학교장이 정한 사유에 의해 출석으로 인정받는 결석입니다.",
                items: [
                    {
                        id: "app-2",
                        title: "학교장 허가 교외체험학습",
                        sub: "가족여행, 친인척 방문, 현장체험 등",
                        desc: "학칙에 따라 사전 신청서를 제출하고 승인을 받아 실시하는 체험학습입니다. 상단에 있는 양식을 다운 받아 작성하실 수 있습니다.",
                        docs: "신청서(사전 제출), 보고서(사후 제출, 보호자와 찍은 사진 첨부 필수)",
                        period: "신청서 : 체험 3일 전 제출 / 보고서 : 체험 후 7일 이내 제출",
                        notes: "1회 7일이내, 연간 20일이내 ",
                        hasTable: false
                    },
                    {
                        id: "app-1",
                        title: "경조사 참여",
                        sub: "",
                        desc: "주말 및 공휴일을 제외한 지정된 일수만큼 출석 인정 처리됩니다.",
                        docs: "결석계, 증빙서류 (청첩장, 사망진단서, 주민등록등본 등)",
                        period: "사유 발생 전 또는 결석 후 3일 이내 제출",
                        notes: "경조사 휴가는 주말 및 공휴일, 재량휴업일은 산입하지 않습니다.",
                        hasTable: true
                    },
                    {
                        id: "app-3",
                        title: "생리결석",
                        sub: "여학생 생리로 인한 결석 (월 1일)",
                        desc: "생리로 인한 결석은 월 1회에 한하여 출석으로 인정됩니다.",
                        docs: "결석신고서",
                        period: "결석한 날로부터 3일 이내 제출",
                        notes: "월 1회",
                        hasTable: false
                    },
                    {
                        id: "app-4",
                        title: "대회/훈련, 기타항목",
                        sub: "천재지변, 법정감염병, 대회/훈련 참가, 등교중지 등",
                        desc: "천재지변, 법정 감염병 격리, 학교장 승인 대회/훈련 참가 및 보건법에 따른 등교중지 조치 등 공식 사유 시 인정됩니다.",
                        docs: "결석계, 의사 진단서/소견서(감염병 시), 대회 참가 승인 공문, 내부결재",
                        period: "등교 재개 후 3일 이내 제출",
                        notes: "법정 감염병(독감, 코로나19 등)은 격리 기간이 적힌 증빙서류가 필수입니다.",
                        hasTable: false
                    }
                ]
            },
            disease: {
                desc: "질병 또는 부상으로 인하여 등교하지 못하는 경우입니다.",
                items: [
                    {
                        id: "dis-1",
                        title: "질병결석",
                        sub: "감기, 부상, 병원 진료 등 질병 사유",
                        desc: "질병으로 인해 수업에 참여하지 못하는 경우입니다.",
                        docs: "결석계, 의사 진단서, 소견서 또는 진료확인서",
                        period: "결석한 날로부터 3일 이내 제출",
                        notes: "동일 질환으로 지속적인 결석이 필요한 경우 사전에 담임교사와 상담을 권장합니다.",
                        hasTable: false
                    }
                ]
            },
            other: {
                desc: "학교장이 인정하는 합당한 사유 이외의 결석입니다.",
                items: [
                    {
                        id: "oth-1",
                        title: "기타결석",
                        sub: "개인 사정, 간병, 가사 조력 등",
                        desc: "부득이한 사정으로 사전에 학교장의 허가를 받아 결석하는 경우입니다.",
                        docs: "결석계 및 사유를 증빙할 수 있는 서류",
                        period: "결석한 날로부터 3일 이내 제출",
                        notes: "학업성적 관리 규정에 따라 성적 산출 시 불이익이 발생할 수 있습니다.",
                        hasTable: false
                    }
                ]
            }
        };

        let currentTab = 'approved';

        // 탭 전환
        function switchTab(tabKey) {
            currentTab = tabKey;
            
            // 탭 스타일 변경
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('text-indigo-600', 'border-indigo-600');
                btn.classList.add('text-slate-500', 'border-transparent');
            });
            const activeBtn = document.getElementById(`tab-${tabKey}`);
            activeBtn.classList.remove('text-slate-500', 'border-transparent');
            activeBtn.classList.add('text-indigo-600', 'border-indigo-600');

            // 탭 설명 갱신
            document.getElementById('tab-desc-text').innerText = ATTENDANCE_DATA[tabKey].desc;

            // 카드 목록 새로 렌더링
            renderCards();
        }

        // 카드 생성
        function renderCards() {
            const container = document.getElementById('card-container');
            container.innerHTML = '';

            const items = ATTENDANCE_DATA[currentTab].items;

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl p-4 border border-slate-200/80 shadow-sm hover:shadow-md transition-all duration-150 cursor-pointer active:scale-[0.99] flex flex-col justify-between';
                card.onclick = () => openModal(item);

                const subTextHtml = item.sub ? `<p class="text-xs text-indigo-600 font-medium mb-2">${item.sub}</p>` : '';

                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-1.5">
                            <h3 class="font-bold text-slate-800 text-sm sm:text-base">${item.title}</h3>
                            <span class="text-[11px] text-slate-400 font-medium">상세보기 <i class="fa-solid fa-chevron-right text-[9px] ml-0.5"></i></span>
                        </div>
                        ${subTextHtml}
                        <p class="text-xs text-slate-500 line-clamp-2 leading-relaxed mb-3">${item.desc}</p>
                    </div>
                    <div class="pt-2.5 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-500">
                        <span class="flex items-center"><i class="fa-solid fa-file-lines text-slate-400 mr-1"></i>${item.docs.split(',')[0]}</span>
                        <span class="text-slate-400">${item.period.split('/')[0]}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 모달 열기
        function openModal(item) {
            const modal = document.getElementById('detail-modal');
            const modalContent = document.getElementById('modal-content');

            // 내용 바인딩
            document.getElementById('modal-title').innerText = item.title;
            document.getElementById('modal-desc').innerText = item.desc;
            document.getElementById('modal-docs').innerText = item.docs;
            document.getElementById('modal-period').innerText = item.period;
            document.getElementById('modal-notes').innerText = item.notes;

            // 뱃지 색상 변경
            const badge = document.getElementById('modal-badge');
            if(currentTab === 'approved') {
                badge.className = "px-2 py-0.5 text-[11px] font-bold rounded-md bg-indigo-100 text-indigo-700";
                badge.innerText = "인정결석";
            } else if(currentTab === 'disease') {
                badge.className = "px-2 py-0.5 text-[11px] font-bold rounded-md bg-emerald-100 text-emerald-700";
                badge.innerText = "질병결석";
            } else {
                badge.className = "px-2 py-0.5 text-[11px] font-bold rounded-md bg-amber-100 text-amber-700";
                badge.innerText = "기타결석";
            }

            // 경조사 표 노출 여부
            const tableArea = document.getElementById('modal-event-table');
            if (item.hasTable) {
                tableArea.classList.remove('hidden');
            } else {
                tableArea.classList.add('hidden');
            }

            // 모달 표시 애니메이션
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalContent.classList.remove('translate-y-full');
        }

        // 모달 닫기
        function closeModal() {
            const modal = document.getElementById('detail-modal');
            const modalContent = document.getElementById('modal-content');

            modalContent.classList.add('translate-y-full');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('pointer-events-none');
            }, 200);
        }

        // 초기 시작
        document.addEventListener('DOMContentLoaded', () => {
            renderCards();
        });
    </script>
</body>
</html>
